# Service for the distributed vLLM Ray cluster
# Exposes OpenAI-compatible API from the Ray head node
apiVersion: v1
kind: Service
metadata:
  name: vllm-distributed
  namespace: hydra-infra
  labels:
    app: vllm-distributed
spec:
  selector:
    app: vllm-distributed
    component: ray-head
  ports:
    - port: 8000
      targetPort: 8000
      name: vllm-api
    - port: 6379
      targetPort: 6379
      name: ray-gcs
    - port: 8265
      targetPort: 8265
      name: ray-dashboard
