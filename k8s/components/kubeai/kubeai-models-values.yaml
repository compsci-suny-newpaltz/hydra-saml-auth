# KubeAI Models Helm values — Hydra cluster GPU models only
# Chimera: 3x RTX 3090 (24GB each), Cerberus: 2x RTX 5090 (32GB each)

catalog:
  # === CHIMERA (3x RTX 3090) — Always-on flagship ===
  qwen-2-5-72b-instruct:
    enabled: true
    features: [TextGeneration]
    owner: Qwen
    url: "hf://Qwen/Qwen2.5-72B-Instruct-AWQ"
    engine: VLLM
    args:
      - "--pipeline-parallel-size=3"
      - "--max-model-len=4096"
      - "--gpu-memory-utilization=0.90"
      - "--enforce-eager"
      - "--dtype=auto"
      - "--quantization=awq"
    resourceProfile: nvidia-rtx-3090:3
    minReplicas: 0
    maxReplicas: 1

  # === CHIMERA — Scale-to-zero (1 GPU each) ===
  glm-4-9b-0414:
    enabled: true
    features: [TextGeneration]
