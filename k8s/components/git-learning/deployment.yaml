apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-learning
  namespace: hydra-infra
  labels:
    app: git-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-learning
  template:
    metadata:
      labels:
        app: git-learning
    spec:
      nodeSelector:
        kubernetes.io/hostname: hydra
      containers:
        - name: git-learning
          # Built locally by scripts/deploy-git-learning.sh and imported into
          # RKE2 containerd; the script pins a versioned tag on the deployment.
          image: docker.io/library/gg-git-learning-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 38765
              name: http
          env:
            - name: PORT
              value: "38765"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /git/healthz
              port: 38765
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /git/healthz
              port: 38765
            initialDelaySeconds: 5
            periodSeconds: 10
